services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nurtricenter_db
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    networks:
      - nurtricenter_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - sqlserver_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nurtricenter_rabbitmq
    ports:
      - "5672:5672"     # protocolo AMQP (lo usan los microservicios)
      - "15672:15672"   # panel de administración web (http://localhost:15672, guest/guest)
    networks:
      - nurtricenter_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  consul:
    image: hashicorp/consul:1.19
    container_name: nurtricenter_consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"   # UI y API HTTP de Consul (http://localhost:8500/ui)
    networks:
      - nurtricenter_network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pacientes:
    build:
      context: .
      dockerfile: Dockerfile.pacientes
    image: kcristalfh/ms-pacientes-evaluacion:latest
    container_name: nurtricenter_pacientes
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PacientesConnection=Server=db;Database=NurTricenterPacientes;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - RabbitMq__HostName=rabbitmq
      # Dentro de la red de Docker Compose todos los contenedores se resuelven por su
      # nombre de servicio, así que Consul puede alcanzar a este contenedor directamente
      # como "pacientes" (no hace falta el truco de host.docker.internal, que solo aplica
      # cuando el servicio corre fuera de Docker con `dotnet run`).
      - ServiceDiscovery__ServiceDiscoveryAddress=http://consul:8500
      - ServiceDiscovery__Host=http://pacientes
      - ServiceDiscovery__Port=8080
      - ServiceDiscovery__ServiceId=pacientes
    ports:
      - "8081:8080"
    networks:
      - nurtricenter_network
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy

  produccion:
    build:
      context: .
      dockerfile: Dockerfile.optimizada
    image: kcristalfh/ms-produccion-alimentos:optimizada
    container_name: nurtricenter_produccion
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=NurTricenter;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - RabbitMq__HostName=rabbitmq
      - ServiceDiscovery__ServiceDiscoveryAddress=http://consul:8500
      - ServiceDiscovery__Host=http://produccion
      - ServiceDiscovery__Port=8080
      - ServiceDiscovery__ServiceId=produccion
    ports:
      - "8082:8080"
    networks:
      - nurtricenter_network
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: kcristalfh/nurtricenter-gateway:latest
    container_name: nurtricenter_gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ServiceDiscovery__ConsulAddress=http://consul:8500
    ports:
      - "5000:8080"
    networks:
      - nurtricenter_network
    depends_on:
      consul:
        condition: service_healthy
      pacientes:
        condition: service_started
      produccion:
        condition: service_started

networks:
  nurtricenter_network:
    driver: bridge

volumes:
  sqlserver_data:
