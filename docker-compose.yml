services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nurtricenter_db
    environment:
      SA_PASSWORD: "NurTricenter2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    networks:
      - nurtricenter_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'NurTricenter2026!' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile.optimizada
    image: kcristalfh/ms-produccion-alimentos:optimizada
    container_name: nurtricenter_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=NurTricenter;User Id=sa;Password=NurTricenter2026!;TrustServerCertificate=True
    ports:
      - "8082:8080"
    networks:
      - nurtricenter_network
    depends_on:
      db:
        condition: service_healthy

networks:
  nurtricenter_network:
    driver: bridge

volumes:
  sqlserver_data: